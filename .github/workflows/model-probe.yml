name: model-probe
# 问网关有哪些模型,并测每个模型「能不能看图」「能不能给准坐标」。
on:
  workflow_dispatch:
    inputs:
      base: { description: "网关 baseUrl", default: "https://api.llmgateway.io/v1" }
      models: { description: "要测的模型(逗号分隔;留空=自动从网关挑)", default: "" }
      claude_probe: { description: "额外跑 Claude 视觉格式探针", default: "false" }
      tool_probe: { description: "跑「工具调用两轮」探针(逗号分隔模型名)", default: "" }
      variant_probe: { description: "跑请求形态变体探针(单个模型名)", default: "" }
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: { PYTHONUTF8: '1', PYTHONIOENCODING: 'utf-8' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 探针
        env: { ENVSHIFT_API_KEY: "${{ secrets.ENVSHIFT_API_KEY }}" }
        run: |
          python model_probe.py --base "${{ inputs.base }}" --models "${{ inputs.models }}"
          [ "${{ inputs.claude_probe }}" = "true" ] && python claude_vision_probe.py || true
          [ -n "${{ inputs.tool_probe }}" ] && python tool_turn_probe.py $(echo "${{ inputs.tool_probe }}" | tr "," " ") || true
          [ -n "${{ inputs.variant_probe }}" ] && python tool_turn_variants.py "${{ inputs.variant_probe }}" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: model-probe, path: model_probe.json }
